<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SteamTW Hunter | 台灣區 Steam 即時特價・史低走勢・期限追蹤網</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    }
    .game-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -6px rgba(102, 192, 244, 0.25);
    }
    @keyframes pulse-Subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.82; }
    }
    .badge-new-low {
      animation: pulse-Subtle 2s infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#1b2838] to-[#2a475e] border border-[#66c0f4]/50 flex items-center justify-center text-[#66c0f4] text-xl shadow">
          <i class="fa-brands fa-steam"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-bold tracking-tight text-white">SteamTW Hunter</h1>
            <span class="text-[11px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-medium">
              TW 台灣區 TWD 官方即時連線
            </span>
          </div>
          <p class="text-xs text-slate-400" id="connectionStatus">正在同步台灣區 Steam 最新售價與特價期限...</p>
        </div>
      </div>

      <!-- 搜尋框 -->
      <div class="flex-1 max-w-md w-full">
        <form id="searchForm" class="relative flex items-center">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-slate-400 text-sm"></i>
          <input
            id="searchInput"
            type="text"
            placeholder="輸入繁中或英文搜台灣 Steam（例：艾爾登法環、惡靈古堡、Cyberpunk）..."
            class="w-full pl-9 pr-24 py-2 rounded-xl bg-slate-800/90 border border-slate-700 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-[#66c0f4]"
          />
          <button
            type="submit"
            class="absolute right-1.5 px-3 py-1 rounded-lg bg-[#66c0f4] hover:bg-[#4192c1] text-slate-950 font-bold text-xs transition"
          >
            搜台灣價
          </button>
        </form>
      </div>

      <!-- 操作工具 -->
      <div class="flex items-center gap-2">
        <button
          onclick="loadInitialData(true)"
          class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-200 flex items-center gap-1.5 transition"
          title="強制重新向 Steam 抓取最新價格"
        >
          <i class="fa-solid fa-rotate" id="refreshIcon"></i>
          <span>刷新價格</span>
        </button>
        <button
          onclick="toggleWishlistDrawer()"
          class="px-3.5 py-2 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/30 text-xs text-amber-300 font-medium flex items-center gap-1.5 transition"
        >
          <i class="fa-solid fa-bell"></i>
          <span>目標價追蹤</span>
          <span id="wishlistBadge" class="px-1.5 py-0.2 rounded-full bg-amber-500 text-slate-950 font-bold text-[11px]">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 篩選與分類控制列 -->
  <section class="bg-slate-900/70 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col gap-3">
      <!-- 第一排：Steam 分類頁籤 + 史低與排序 -->
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2" id="categoryTabs">
          <button onclick="switchTab('all')" data-tab="all" class="tab-btn px-3.5 py-1.5 rounded-lg text-xs font-bold bg-[#66c0f4] text-slate-950 transition">
            🔥 全部即時清單 (<span id="countAll">0</span>)
          </button>
          <button onclick="switchTab('specials')" data-tab="specials" class="tab-btn px-3.5 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
            🏷️ Steam 今日特惠 (<span id="countSpecials">0</span>)
          </button>
          <button onclick="switchTab('aaa')" data-tab="aaa" class="tab-btn px-3.5 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
            👑 熱門大作即時價 (<span id="countAaa">0</span>)
          </button>
          <button onclick="switchTab('top_sellers')" data-tab="top_sellers" class="tab-btn px-3.5 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
            📈 台灣區熱銷榜 (<span id="countTop">0</span>)
          </button>
        </div>

        <div class="flex flex-wrap items-center gap-3 text-xs">
          <label class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-rose-500/15 border border-rose-500/30 cursor-pointer text-rose-300 font-semibold">
            <input type="checkbox" id="onlyHistoricalLowToggle" onchange="renderGames()" class="rounded accent-rose-500" />
            <span>🔥 只看新史低 / 平史低</span>
          </label>

          <label class="flex items-center gap-1.5 cursor-pointer text-slate-300">
            <input type="checkbox" id="onlyDiscountToggle" onchange="renderGames()" class="rounded accent-[#66c0f4]" />
            <span>只看特價中</span>
          </label>

          <select
            id="sortSelect"
            onchange="renderGames()"
            class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-[#66c0f4]"
          >
            <option value="low_first">🔥 新史低 / 平史低優先</option>
            <option value="discount_desc">💥 折扣幅度 (最高優先)</option>
            <option value="price_asc">💰 目前售價 (由低到高)</option>
            <option value="price_desc">💎 目前售價 (由高到低)</option>
          </select>
        </div>
      </div>

      <!-- 第二排：價格快速挑選按鈕 + 預算滑桿 -->
      <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-800/80 text-xs">
        <div class="flex flex-wrap items-center gap-1.5">
          <span class="text-slate-400 mr-1">🪙 快速價格篩選：</span>
          <button onclick="setQuickBudget(2500)" data-budget="2500" class="budget-btn px-2.5 py-1
